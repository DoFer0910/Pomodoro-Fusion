<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 10px; font-family: sans-serif; }
    h2 { font-size: 16px; margin-top: 0; }
    .group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 5px; }
    button { width: 100%; padding: 8px; background: #ea580c; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #c2410c; }
    .status { margin-top: 10px; font-size: 12px; color: green; text-align: center; display: none; }
  </style>
</head>
<body>
  <h2>Pomodoro Launcher</h2>
  
  <div class="group">
    <label for="targetUrl">Trigger Site (Partial URL):</label>
    <input type="text" id="targetUrl" placeholder="e.g. github.com">
  </div>

  <div class="group">
    <label for="appUrl">App URL:</label>
    <input type="text" id="appUrl" placeholder="http://localhost:3000">
  </div>

  <button id="save">Save Settings</button>
  <div id="status" class="status">Saved!</div>

  <script src="popup.js"></script>
</body>
</html>
