name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-record-e2e-results
          path: test-results/
          if-no-files-found: ignore
